<mat-toolbar color="primary" class="toolbar">
  <span class="brand">Ticket Management</span>
  <span class="spacer"></span>
  @if (authService.currentUser(); as user) {
    <span class="user-chip">{{ user.fullName }} &middot; {{ user.role }}</span>
    <button mat-icon-button (click)="logout()" aria-label="Log out" title="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/tickets" routerLinkActive="active-link">
        <mat-icon matListItemIcon>confirmation_number</mat-icon>
        <span matListItemTitle>Tickets</span>
      </a>
      <a mat-list-item routerLink="/tickets/new" routerLinkActive="active-link">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>New Ticket</span>
      </a>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      @if (authService.role() === UserRole.Admin) {
        <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link">
          <mat-icon matListItemIcon>group</mat-icon>
          <span matListItemTitle>Manage Users</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
